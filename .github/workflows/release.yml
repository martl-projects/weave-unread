name: release

# A tag (v1.0) builds the hint service into a WebAssembly component and attaches it to a GitHub release.
# Then, in Weave: weave app release <tag> --asset wasm=weave-unread.tar.gz -p <project>
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: tar czf weave-unread.tar.gz unread.wasm weave.app.json README.md
      - run: gh release create "$GITHUB_REF_NAME" weave-unread.tar.gz --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
